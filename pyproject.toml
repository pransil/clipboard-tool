[project]
name = "clipmgr"
version = "0.1.0"
description = "A small macOS clipboard history manager (text only, in-memory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
]

[project.scripts]
clipmgr = "clipmgr.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmgr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
